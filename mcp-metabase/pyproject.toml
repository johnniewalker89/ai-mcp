[project]
name = "mcp-metabase"
version = "0.1.0"
description = "Identity-bound Metabase MCP with bounded reads and exact safe mutations."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastmcp>=3.4,<4",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "sqlglot==30.14.0",
]

[project.scripts]
mcp-metabase = "mcp_metabase.main:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_metabase"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
